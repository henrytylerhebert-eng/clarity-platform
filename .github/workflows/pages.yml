name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # Publish ONLY the self-contained shareable artifact. The rest of docs/ is
      # internal (risk register, security posture, open decisions, audits) and must
      # not be pushed to a public site.
      - name: Stage shareable artifact
        run: |
          mkdir -p _site-staging
          cp docs/index.html _site-staging/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site-staging
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
