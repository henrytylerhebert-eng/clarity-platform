name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clarity
          POSTGRES_PASSWORD: clarity
          POSTGRES_DB: clarity_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clarity -d clarity_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Integration tests refuse to run against anything but local clarity_dev
      # (assertLocalClarityDevDatabase); the service container satisfies that.
      DATABASE_URL: postgresql://clarity:clarity@localhost:5432/clarity_dev?schema=public
      # The harness also refuses any database not marked disposable, so DB-writing
      # tests can never reach a developer's persistent clarity_dev. This service
      # container is created and destroyed per run, so it qualifies.
      CLARITY_DISPOSABLE_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate and generate
        run: |
          npx prisma validate
          npx prisma generate

      - name: Apply migrations to the ephemeral database
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Root tests (unit + integration)
        run: npm test

      - name: App tests
        run: npm run test:app

      - name: App build
        run: npm --workspace app run build

      - name: Shell smoke E2E (general Work/prototype browser regression)
        # app/playwright.config.ts — desktop + mobile, vite only, no API server.
        # Proves the prototype shell still renders and navigates. It does NOT
        # prove governed behavior, authorization, or the Tree 4 F1-F6 flows
        # beyond what app/smoke/tree4-acceptance.spec.ts explicitly asserts.
        # Kept separate from the Operating Assurance config below on purpose:
        # they prove different things and need different servers.
        run: npm --workspace app run smoke

      - name: Operating Assurance replay E2E
        run: npm run test:oa-e2e

      - name: Dependency audit
        run: npm audit --audit-level=high
