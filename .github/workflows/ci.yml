name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clarity
          POSTGRES_PASSWORD: clarity
          POSTGRES_DB: clarity_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clarity -d clarity_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Integration tests refuse to run against anything but local clarity_dev
      # (assertLocalClarityDevDatabase); the service container satisfies that.
      # connection_limit raises Prisma's default pool (2 * CPUs + 1, very small
      # on a shared runner) so the full suite's concurrent interactive
      # transactions don't intermittently fail to acquire a client and surface
      # as unmapped 500s (observed in tests/integration/operating-workbook.test.ts).
      DATABASE_URL: postgresql://clarity:clarity@localhost:5432/clarity_dev?schema=public&connection_limit=20&pool_timeout=20
      # TEMPORARY (PR #64 diagnostic, remove before merge): surfaces the
      # shape of any unmapped error server-side; the public response stays
      # a content-free 500 regardless. See toHttpError in server.ts.
      PR64_DIAGNOSTIC_LOG_UNMAPPED_ERRORS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate and generate
        run: |
          npx prisma validate
          npx prisma generate

      - name: Apply migrations to the ephemeral database
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Root tests (unit + integration)
        run: npm test

      - name: App tests
        run: npm run test:app

      - name: Dependency audit
        run: npm audit --audit-level=high
